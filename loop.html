<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1; i<=5; i++) {
            document.write("This is iteration number: " + i + "<br>");
        }
        let n = 1;
        while(n<=5) {
            document.write("This is while loop iteration number: " + n + "<br>");
            n++;
        }
    </script>
</body>
</html>
