<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="head">
            <img src="./images.jpeg" width="50px" height="50px">
            <p>Bus Booking System</p>
        </div>
        <p class="infohead">User Info</p>
        <form id="userForm">
            <div>
            <label for="name">user name</label>
            <input type="text" name="name" id="name" placeholder="Enter your name"></div>
            <div>
            <label for="age">Age</label>
            <input type="number" name="age" id="age" placeholder="Enter your age">
            </div>
            <div>
            <label for="aadhar">Aadhaar Number</label>
            <input type="text" name="adhar" id="adhar" placeholder="Enter your Aadhaar number">
            </div>
            <div>
            <label for="city">City</label>
            <select name="city" id="city">
                <option value="delhi">Delhi</option>
                <option value="mumbai">Mumbai</option>
                <option value="bangalore">Bangalore</option>
            </select>
            </div>
            <div>
            <label for="date">Journey Date</label>
            <input type="date" name="date" id="date">
            </div>
        </form>
            <p class="businfo">Bus Info</p>

            <form id="busForm">
                <div class="seat">
            <input type="radio" name="bus" id="ac" value="ac">
            <label for="ac">AC (2000rs)</label>
            <input type="radio" name="bus" id="nonac" value="nonac">
            <label for="nonac">Non-AC (1500rs)</label>
            </div>
            <div>
            <label for="seats">Number of Seats</label>
            <input type="number" name="seats" id="seats" min="1" max="5"></div>
            <button type="submit" onclick="card()">Submit</button>
        </form>
    </div>
    <div id="bookingCard" class="booking-card">
    <h2>Booking info</h2>

    <p><strong>Name:</strong> <span id="displayName"></span></p>
    <p><strong>Age:</strong> <span id="displayAge"></span></p>
    <p><strong>Aadhaar Number:</strong> <span id="displayAadhar"></span></p>
    <p><strong>City:</strong> <span id="displayCity"></span></p>
    <p><strong>Journey Date:</strong> <span id="displayDate"></span></p>
    <p><strong>Number of Seats:</strong> <span id="displaySeats"></span></p>
    <p><strong>Total Fare:</strong> ₹<span id="displayFare"></span></p>
</div>
    <script src="script.js"></script>
</body>
</html>
